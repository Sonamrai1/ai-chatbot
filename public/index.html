<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div class="app">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">✦</span>
        <span class="logo-text">AI Chat</span>
      </div>
      <button class="new-chat-btn" id="newChatBtn" title="New Chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New Chat
      </button>
    </div>

    <div class="sessions-label">Recent Chats</div>
    <ul class="session-list" id="sessionList"></ul>

    <div class="sidebar-footer">
      <div class="model-badge">✦ Gemini 2.0 Flash</div>
    </div>
  </aside>

  <!-- ── MAIN CHAT ── -->
  <main class="chat-main">

    <div class="chat-header">
      <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="chat-title" id="chatTitle">New Chat</span>
    </div>

    <!-- Messages -->
    <div class="messages-container" id="messages">
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon">✦</div>
        <h1>How can I help you today?</h1>
        <p>Ask me anything — I'm powered by Google Gemini.</p>
        <div class="suggestions">
          <button class="suggestion-chip" onclick="useSuggestion(this)">Explain quantum computing simply</button>
          <button class="suggestion-chip" onclick="useSuggestion(this)">Write a Python function to sort a list</button>
          <button class="suggestion-chip" onclick="useSuggestion(this)">Give me 5 ideas for a mobile app</button>
          <button class="suggestion-chip" onclick="useSuggestion(this)">What's the difference between RAM and ROM?</button>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-wrapper">
      <div class="input-area">
        <textarea
          id="userInput"
          placeholder="Message AI Chat..."
          rows="1"
          maxlength="4000"
        ></textarea>
        <button class="send-btn" id="sendBtn" title="Send message">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-footer">Press Enter to send, Shift+Enter for new line</div>
    </div>

  </main>
</div>

<script src="script.js"></script>
</body>
</html>
